name: Upload GlitchTip Source Maps
description: Build frontend source maps and upload them with runtime CI configuration.
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        package_json_file: frontend/package.json

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install frontend dependencies
      shell: bash
      run: pnpm --dir frontend install --frozen-lockfile

    - name: Build and upload source maps
      shell: bash
      run: |
        pnpm --dir frontend build
        ./utils/upload-glitchtip-sourcemaps.sh frontend/dist/client
