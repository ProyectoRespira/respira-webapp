name: "Demo Prepare Env"

description: "Decode ENV_FILE_DEMO and validate required key presence."

inputs:
  env_file_b64:
    description: Base64-encoded env file content
    required: true
  required_keys:
    description: Multiline list of required env variable keys
    required: false
    default: ""

outputs:
  env_file:
    description: Path to decoded env file
    value: ${{ steps.prepare.outputs.env_file }}

runs:
  using: composite
  steps:
    - name: Decode and validate env file
      id: prepare
      shell: bash
      env:
        ENV_FILE_B64: ${{ inputs.env_file_b64 }}
        REQUIRED_KEYS: ${{ inputs.required_keys }}
      run: |
        set -euo pipefail

        if [ -z "$ENV_FILE_B64" ]; then
          echo "Missing ENV_FILE_DEMO secret."
          exit 1
        fi

        env_file="$RUNNER_TEMP/env-demo"
        if ! printf '%s' "$ENV_FILE_B64" | base64 --decode > "$env_file"; then
          echo "ENV_FILE_DEMO is not valid base64 or could not be decoded."
          exit 1
        fi
        chmod 600 "$env_file"

        missing=()
        while IFS= read -r raw_key; do
          key="$(printf '%s' "$raw_key" | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')"
          if [ -z "$key" ]; then
            continue
          fi

          # Keep validation readable: missing keys should be reported as a list, not fail fast inside grep.
          line="$(grep -E "^${key}=" "$env_file" | head -n 1 || true)"
          val="${line#*=}"
          val="$(printf '%s' "$val" | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')"
          if [ -z "$val" ]; then
            missing+=("$key")
          fi
        done <<REQUIRED_KEYS_EOF
        $REQUIRED_KEYS
        REQUIRED_KEYS_EOF

        if [ "${#missing[@]}" -gt 0 ]; then
          echo "Missing or empty required env vars in ENV_FILE_DEMO:"
          for key in "${missing[@]}"; do
            echo "  - $key"
          done
          exit 1
        fi

        echo "ENV_FILE_DEMO decoded and required keys validated."

        echo "env_file=$env_file" >> "$GITHUB_OUTPUT"
