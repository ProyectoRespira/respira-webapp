name: Deploy Respira Webapp (prod)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    # Auto-deploys stay off by default on main. A manual workflow run can still deploy.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_PROD_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script: |
            /opt/respira-webapp/deploy.sh
