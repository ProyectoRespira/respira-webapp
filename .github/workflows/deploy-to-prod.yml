name: Deploy to Production

run-name: Deploy Respira WebApp to Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-remote-compose-webapp-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Ensure main branch dispatch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "This workflow can only be executed from the main branch."
            echo "In GitHub Actions, set 'Use workflow from' to 'main'."
            exit 1
          fi

      - name: Check authorization
        env:
          ALLOWED_USERS_PROD: ${{ vars.DEPLOY_ALLOWED_USERS_PROD }}
        run: |
          ALLOWED_USERS="$ALLOWED_USERS_PROD"

          if [ -z "$ALLOWED_USERS" ]; then
            echo "Error: DEPLOY_ALLOWED_USERS_PROD variable not configured"
            exit 1
          fi

          CURRENT_USER="${{ github.actor }}"
          if echo "$ALLOWED_USERS" | grep -qw "$CURRENT_USER"; then
            echo "✓ User $CURRENT_USER is authorized to deploy to production"
          else
            echo "✗ User $CURRENT_USER is NOT authorized to deploy to production"
            exit 1
          fi

      - name: Validate SSH configuration
        id: prepare_ssh_key
        env:
          DEPLOY_HOST_VALUE: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_VALUE: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          echo "::add-mask::$DEPLOY_HOST_VALUE"
          echo "::add-mask::$DEPLOY_USER_VALUE"
          echo "::add-mask::$DEPLOY_SSH_KEY_VALUE"

          if [ -z "$DEPLOY_HOST_VALUE" ]; then
            echo "Missing DEPLOY_HOST secret for production environment."
            exit 1
          fi

          if [ -z "$DEPLOY_USER_VALUE" ]; then
            echo "Missing DEPLOY_USER secret for production environment."
            exit 1
          fi

          if [ -z "$DEPLOY_SSH_KEY_VALUE" ]; then
            echo "Missing DEPLOY_SSH_KEY secret for production environment."
            exit 1
          fi

          tmp_key="$RUNNER_TEMP/deploy_ssh_key"
          if printf '%s' "$DEPLOY_SSH_KEY_VALUE" | grep -q '\\n'; then
            printf '%b' "$DEPLOY_SSH_KEY_VALUE" > "$tmp_key"
          else
            printf '%s\n' "$DEPLOY_SSH_KEY_VALUE" > "$tmp_key"
          fi
          chmod 600 "$tmp_key"

          if ! grep -q 'BEGIN .*PRIVATE KEY' "$tmp_key"; then
            echo "DEPLOY_SSH_KEY does not look like a valid private key for production environment."
            exit 1
          fi

          if ! ssh-keygen -y -f "$tmp_key" >/dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY could not be parsed for production environment."
            echo "It may be malformed, for a different key type, or encrypted with a passphrase."
            exit 1
          fi

          echo "key_path=$tmp_key" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and write env file
        id: write_env
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE_PROD }}
        run: |
          if [ -z "$ENV_FILE_B64" ]; then
            echo "Missing ENV_FILE_PROD secret. See docs/deploy-secrets.md."
            exit 1
          fi

          env_file="$RUNNER_TEMP/env-prod"
          printf '%s' "$ENV_FILE_B64" | base64 --decode > "$env_file"

          # Keys that must be present and non-empty in the env file.
          # These are all vars in docker-compose.yml that have no :-default fallback.
          required_keys=(
            BACKEND_SECRET_KEY
            BACKEND_POSTGRES_DB
            BACKEND_POSTGRES_USER
            BACKEND_POSTGRES_PASSWORD
            BACKEND_POSTGRES_HOST
            PUBLIC_REGION_DEFAULT_ID
            BACKEND_URL
            FRONTEND_PORT
            SITE_URL
            PUBLIC_GTAG
            CONTACT_MAIL
            TWITTER_HANDLE
            TELEGRAM_CHANNEL
            FACEBOOK_PAGE
            INSTAGRAM_HANDLE
            GITHUB_PATH
            SLACK_INVITE_PATH
            APP_STORE_PATH
            PLAY_STORE_APP_ID
            SMTP_KEY
            SMTP_SENDER
            SERVER_HOST
            CERT_NAME
            PROXY_PORT
          )

          missing=()
          for key in "${required_keys[@]}"; do
            val="$(grep -E "^${key}=" "$env_file" | cut -d= -f2- | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')"
            if [ -z "$val" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing or empty required env vars in ENV_FILE_PROD:"
            for k in "${missing[@]}"; do echo "  - $k"; done
            exit 1
          fi

          echo "All required env vars present."
          echo "env_file=$env_file" >> "$GITHUB_OUTPUT"

      - name: Copy compose and env files to server
        id: copy_files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPOSE_PATH: ${{ secrets.DEPLOY_COMPOSE_PATH_WEBAPP }}
          KEY_PATH: ${{ steps.prepare_ssh_key.outputs.key_path }}
          ENV_FILE: ${{ steps.write_env.outputs.env_file }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$DEPLOY_HOST_KEY" ]; then
            echo "Missing required DEPLOY_HOST_KEY secret in Production environment."
            exit 1
          fi

          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          scp -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            docker-compose.yml \
            docker-compose.remote.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$COMPOSE_PATH/"

          scp -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$ENV_FILE" \
            "$DEPLOY_USER@$DEPLOY_HOST:$COMPOSE_PATH/.env.prod"

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPOSE_PATH: ${{ secrets.DEPLOY_COMPOSE_PATH_WEBAPP }}
          KEY_PATH: ${{ steps.prepare_ssh_key.outputs.key_path }}
        run: |
          ssh -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "export COMPOSE_PATH='$COMPOSE_PATH'; bash -se" <<'REMOTE_SCRIPT'
          set -euo pipefail

          if [ -z "$COMPOSE_PATH" ] || [ ! -d "$COMPOSE_PATH" ]; then
            echo "Invalid DEPLOY_COMPOSE_PATH_WEBAPP configured for selected environment."
            exit 1
          fi

          cd "$COMPOSE_PATH"

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.remote.yml \
            --env-file .env.prod \
            up -d --pull always --remove-orphans

          timeout_seconds=600
          interval_seconds=10
          elapsed=0

          while true; do
            containers="$(docker compose ps -q)"
            if [ -z "$containers" ]; then
              echo "No containers were created by docker compose."
              docker compose ps
              exit 1
            fi

            all_running=true
            all_healthy=true

            for container in $containers; do
              name="$(docker inspect --format '{{.Name}}' "$container" | sed 's#^/##')"
              state="$(docker inspect --format '{{.State.Status}}' "$container")"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container")"

              echo "$name state=$state health=$health"

              if [ "$state" != "running" ]; then
                all_running=false
              fi

              if [ "$health" = "unhealthy" ]; then
                echo "$name is unhealthy"
                docker compose ps
                exit 1
              fi

              if [ "$health" != "none" ] && [ "$health" != "healthy" ]; then
                all_healthy=false
              fi
            done

            if [ "$all_running" = true ] && [ "$all_healthy" = true ]; then
              echo "Compose stack is up and healthy."
              break
            fi

            if [ "$elapsed" -ge "$timeout_seconds" ]; then
              echo "Timed out waiting for stack to become ready."
              docker compose ps
              exit 1
            fi

            sleep "$interval_seconds"
            elapsed=$((elapsed + interval_seconds))
          done

          docker system prune -af
          docker image prune -af
          docker builder prune -af
          REMOTE_SCRIPT

      - name: Post-deploy summary
        run: |
          echo "Deployment of Respira WebApp to Production completed on remote server."
