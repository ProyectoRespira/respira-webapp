name: Backend Typecheck

on:
  pull_request:
    branches: [main, develop, dev]
    types: [opened, reopened, synchronize]
    paths:
      - "backend/**"
      - ".github/workflows/backend-typecheck.yml"

permissions:
  contents: read

concurrency:
  group: backend-typecheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Backend Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install mypy==1.18.2 django-stubs==4.2.7 django-stubs-ext==4.2.7 types-PyYAML==6.0.12.20260508 types-requests==2.33.0.20260508

      - name: Run mypy
        run: PYTHONPATH=backend mypy --config-file backend/mypy.ini backend/api backend/backend backend/manage.py
