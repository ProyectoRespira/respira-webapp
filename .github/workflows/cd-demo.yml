name: CD Demo

run-name: Deploy Respira WebApp to Demo

on:
  # Automatically deploy after every successful CI build on dev.
  workflow_run:
    workflows: ["CI Demo"]
    types: [completed]
    branches: [dev]
  # Manual trigger: deploy a specific already-published tag.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (must already be published to GHCR)"
        required: true
        type: string
        default: "dev-latest"

permissions:
  contents: read

concurrency:
  group: cd-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-demo:
    name: Deploy to Demo Server
    # For workflow_run: only deploy when CI succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: Demo
    steps:
      - name: Resolve image tag and validate branch
        id: set_tag
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            branch="${GITHUB_REF_NAME}"
            tag="${{ inputs.image_tag }}"
            if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
              echo "image_tag must be a valid Docker tag: start with [A-Za-z0-9_], then only [A-Za-z0-9_.-], max 128 chars"
              exit 1
            fi
          else
            branch="$HEAD_BRANCH"
            tag="dev-latest"
          fi

          if [ "$branch" != "dev" ]; then
            echo "This deployment can only be executed from the dev branch."
            exit 1
          fi

          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check authorization
        # Authorization is only required for manual dispatches.
        # Auto-deploys from CI are trusted: the push already passed branch protection.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ALLOWED_USERS_DEMO: ${{ vars.DEPLOY_ALLOWED_USERS_DEMO }}
        run: |
          ALLOWED_USERS="$ALLOWED_USERS_DEMO"

          if [ -z "$ALLOWED_USERS" ]; then
            echo "Error: DEPLOY_ALLOWED_USERS_DEMO variable not configured"
            exit 1
          fi

          CURRENT_USER="${{ github.actor }}"
          if echo "$ALLOWED_USERS" | grep -qw "$CURRENT_USER"; then
            echo "✓ User $CURRENT_USER is authorized to deploy to demo"
          else
            echo "✗ User $CURRENT_USER is NOT authorized to deploy to demo"
            exit 1
          fi

      - name: Validate SSH configuration
        id: prepare_ssh_key
        env:
          DEPLOY_HOST_VALUE: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_VALUE: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          echo "::add-mask::$DEPLOY_HOST_VALUE"
          echo "::add-mask::$DEPLOY_USER_VALUE"
          echo "::add-mask::$DEPLOY_SSH_KEY_VALUE"

          if [ -z "$DEPLOY_HOST_VALUE" ]; then
            echo "Missing DEPLOY_HOST secret for demo environment."
            exit 1
          fi

          if [ -z "$DEPLOY_USER_VALUE" ]; then
            echo "Missing DEPLOY_USER secret for demo environment."
            exit 1
          fi

          if [ -z "$DEPLOY_SSH_KEY_VALUE" ]; then
            echo "Missing DEPLOY_SSH_KEY secret for demo environment."
            exit 1
          fi

          tmp_key="$RUNNER_TEMP/deploy_ssh_key"
          if printf '%s' "$DEPLOY_SSH_KEY_VALUE" | grep -q '\\n'; then
            printf '%b' "$DEPLOY_SSH_KEY_VALUE" > "$tmp_key"
          else
            printf '%s\n' "$DEPLOY_SSH_KEY_VALUE" > "$tmp_key"
          fi
          chmod 600 "$tmp_key"

          if ! grep -q 'BEGIN .*PRIVATE KEY' "$tmp_key"; then
            echo "DEPLOY_SSH_KEY does not look like a valid private key for demo environment."
            exit 1
          fi

          if ! ssh-keygen -y -f "$tmp_key" >/dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY could not be parsed for demo environment."
            echo "It may be malformed, for a different key type, or encrypted with a passphrase."
            exit 1
          fi

          echo "key_path=$tmp_key" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate and write env file
        id: write_env
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE_DEMO }}
        run: |
          if [ -z "$ENV_FILE_B64" ]; then
            echo "Missing ENV_FILE_DEMO secret. See docs/deploy-secrets.md."
            exit 1
          fi

          env_file="$RUNNER_TEMP/env-demo"
          printf '%s' "$ENV_FILE_B64" | base64 --decode > "$env_file"

          # Keys that must be present and non-empty in the env file.
          # These are all vars in docker-compose.yml that have no :-default fallback.
          required_keys=(
            BACKEND_SECRET_KEY
            BACKEND_POSTGRES_DB
            BACKEND_POSTGRES_USER
            BACKEND_POSTGRES_PASSWORD
            BACKEND_POSTGRES_HOST
            PUBLIC_REGION_DEFAULT_ID
            BACKEND_URL
            FRONTEND_PORT
            SITE_URL
            PUBLIC_GTAG
            CONTACT_MAIL
            TWITTER_HANDLE
            TELEGRAM_CHANNEL
            FACEBOOK_PAGE
            INSTAGRAM_HANDLE
            GITHUB_PATH
            SLACK_INVITE_PATH
            APP_STORE_PATH
            PLAY_STORE_APP_ID
            SMTP_KEY
            SMTP_SENDER
            SERVER_HOST
            CERT_NAME
            PROXY_PORT
          )

          missing=()
          for key in "${required_keys[@]}"; do
            val="$(grep -E "^${key}=" "$env_file" | cut -d= -f2- | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')"
            if [ -z "$val" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing or empty required env vars in ENV_FILE_DEMO:"
            for k in "${missing[@]}"; do echo "  - $k"; done
            exit 1
          fi

          echo "All required env vars present."
          echo "env_file=$env_file" >> "$GITHUB_OUTPUT"

      - name: Copy compose and env files to server
        id: copy_files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPOSE_PATH: ${{ secrets.DEPLOY_COMPOSE_PATH_WEBAPP }}
          KEY_PATH: ${{ steps.prepare_ssh_key.outputs.key_path }}
          ENV_FILE: ${{ steps.write_env.outputs.env_file }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$DEPLOY_HOST_KEY" ]; then
            echo "Missing required DEPLOY_HOST_KEY secret in Demo environment."
            exit 1
          fi

          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          DEPLOY_HOST_FINGERPRINT="$(printf '%s\n' "$DEPLOY_HOST_KEY" | ssh-keygen -E sha256 -lf - | awk '{print $2}')"
          if [ -z "$DEPLOY_HOST_FINGERPRINT" ]; then
            echo "Failed to derive SSH host fingerprint from DEPLOY_HOST_KEY."
            exit 1
          fi
          echo "fingerprint=$DEPLOY_HOST_FINGERPRINT" >> "$GITHUB_OUTPUT"

          scp -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            docker-compose.yml \
            docker-compose.remote.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$COMPOSE_PATH/"

          scp -i "$KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$ENV_FILE" \
            "$DEPLOY_USER@$DEPLOY_HOST:$COMPOSE_PATH/.env.demo"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          fingerprint: ${{ steps.copy_files.outputs.fingerprint }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ steps.prepare_ssh_key.outputs.key_path }}
          port: 22
          command_timeout: 30m
          script: |
            set -euo pipefail

            COMPOSE_PATH="${{ secrets.DEPLOY_COMPOSE_PATH_WEBAPP }}"
            if [ -z "$COMPOSE_PATH" ] || [ ! -d "$COMPOSE_PATH" ]; then
              echo "Invalid DEPLOY_COMPOSE_PATH_WEBAPP configured for demo environment."
              exit 1
            fi

            cd "$COMPOSE_PATH"

            # Override the image tag from the env file default.
            export BACKEND_IMAGE_TAG="${{ steps.set_tag.outputs.image_tag }}"
            export FRONTEND_IMAGE_TAG="${{ steps.set_tag.outputs.image_tag }}"
            export PROXY_IMAGE_TAG="${{ steps.set_tag.outputs.image_tag }}"

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.remote.yml \
              --env-file .env.demo \
              up -d --pull always --remove-orphans

            timeout_seconds=600
            interval_seconds=10
            elapsed=0

            while true; do
              containers="$(docker compose ps -q)"
              if [ -z "$containers" ]; then
                echo "No containers were created by docker compose."
                docker compose ps
                exit 1
              fi

              all_running=true
              all_healthy=true

              for container in $containers; do
                name="$(docker inspect --format '{{.Name}}' "$container" | sed 's#^/##')"
                state="$(docker inspect --format '{{.State.Status}}' "$container")"
                health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container")"

                echo "$name state=$state health=$health"

                if [ "$state" != "running" ]; then
                  all_running=false
                fi

                if [ "$health" = "unhealthy" ]; then
                  echo "$name is unhealthy"
                  docker compose ps
                  exit 1
                fi

                if [ "$health" != "none" ] && [ "$health" != "healthy" ]; then
                  all_healthy=false
                fi
              done

              if [ "$all_running" = true ] && [ "$all_healthy" = true ]; then
                echo "Compose stack is up and healthy."
                break
              fi

              if [ "$elapsed" -ge "$timeout_seconds" ]; then
                echo "Timed out waiting for stack to become ready."
                docker compose ps
                exit 1
              fi

              sleep "$interval_seconds"
              elapsed=$((elapsed + interval_seconds))
            done

            docker system prune -af
            docker image prune -af
            docker builder prune -af

      - name: Post-deploy summary
        run: |
          echo "Deployment of Respira WebApp to Demo completed on remote server."
