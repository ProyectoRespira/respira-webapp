name: Deploy Demo from Release/Hotfix

on:
  push:
    branches:
      - release/*
      - hotfix/*
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write

concurrency:
  group: demo-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Release/Hotfix Branch
    if: ${{ github.repository == 'ProyectoRespira/respira-webapp' }}
    runs-on: ubuntu-latest
    outputs:
      branch_tag: ${{ steps.extract_tag.outputs.tag }}
      prefixed_tag: ${{ steps.extract_tag.outputs.prefixed_tag }}
      branch_type: ${{ steps.extract_tag.outputs.branch_type }}
    steps:
      - name: Extract and validate branch tag
        id: extract_tag
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Expected branch names:
          # release/vX.Y.Z
          # hotfix/vX.Y.Z
          if [[ "$BRANCH_NAME" =~ ^(release|hotfix)/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            BRANCH_TYPE="${BASH_REMATCH[1]}"
            BRANCH_TAG="${BASH_REMATCH[2]}"
          else
            echo "Branch must match pattern: release/vX.Y.Z or hotfix/vX.Y.Z"
            echo "Current branch: $BRANCH_NAME"
            exit 1
          fi

          echo "branch_type=$BRANCH_TYPE" >> "$GITHUB_OUTPUT"
          echo "tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"
          echo "prefixed_tag=${BRANCH_TYPE}-${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "Validated branch: $BRANCH_NAME -> ${BRANCH_TYPE}-${BRANCH_TAG}"

  publish:
    name: Publish Images to GHCR
    needs: validate
    if: ${{ github.repository == 'ProyectoRespira/respira-webapp' }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      RELEASE_TAG: ${{ needs.validate.outputs.branch_tag }}
      PREFIXED_TAG: ${{ needs.validate.outputs.prefixed_tag }}
    steps:
      - name: Normalize image owner
        id: normalize_owner
        shell: bash
        run: |
          set -euo pipefail
          echo "image_owner_lc=${IMAGE_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata backend
        id: meta_backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-backend
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.PREFIXED_TAG }}
            type=sha,prefix=sha-

      - name: Docker metadata frontend
        id: meta_frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-frontend
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.PREFIXED_TAG }}
            type=sha,prefix=sha-

      - name: Docker metadata proxy
        id: meta_proxy
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-proxy
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.PREFIXED_TAG }}
            type=sha,prefix=sha-

      - name: Build and push backend image
        id: push_backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          provenance: true
          sbom: true

      - name: Build and push frontend image
        id: push_frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          provenance: true
          sbom: true

      - name: Build and push proxy image
        id: push_proxy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./proxy
          file: ./proxy/Dockerfile
          push: true
          tags: ${{ steps.meta_proxy.outputs.tags }}
          labels: ${{ steps.meta_proxy.outputs.labels }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,scope=proxy,mode=max
          provenance: true
          sbom: true

      - name: Generate backend image attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-backend
          subject-digest: ${{ steps.push_backend.outputs.digest }}
          push-to-registry: true

      - name: Generate frontend image attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-frontend
          subject-digest: ${{ steps.push_frontend.outputs.digest }}
          push-to-registry: true

      - name: Generate proxy image attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.normalize_owner.outputs.image_owner_lc }}/respira-proxy
          subject-digest: ${{ steps.push_proxy.outputs.digest }}
          push-to-registry: true

  deploy-demo:
    name: Deploy to Demo Server
    needs: [validate, publish]
    if: ${{ github.repository == 'ProyectoRespira/respira-webapp' }}
    runs-on: ubuntu-latest
    environment: Demo
    steps:
      - name: Check authorization
        shell: bash
        env:
          ALLOWED_USERS_DEMO: ${{ vars.DEPLOY_ALLOWED_USERS_DEMO }}
          CURRENT_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [ -z "$ALLOWED_USERS_DEMO" ]; then
            echo "DEPLOY_ALLOWED_USERS_DEMO variable is not configured"
            exit 1
          fi

          if echo "$ALLOWED_USERS_DEMO" | grep -Eq '(^|[[:space:],])'"$CURRENT_USER"'([[:space:],]|$)'; then
            echo "User $CURRENT_USER is authorized to deploy to Demo"
          else
            echo "User $CURRENT_USER is NOT authorized to deploy to Demo"
            exit 1
          fi

      - name: Validate SSH configuration
        id: prepare_ssh_key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Missing DEPLOY_SSH_KEY secret in Demo environment"
            exit 1
          fi

          tmp_key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$tmp_key"
          chmod 600 "$tmp_key"

          if ! ssh-keygen -y -f "$tmp_key" >/dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY could not be parsed"
            exit 1
          fi

          echo "key_path=$tmp_key" >> "$GITHUB_OUTPUT"

      - name: Validate and write env file
        id: write_env
        shell: bash
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE_DEMO }}
        run: |
          set -euo pipefail

          if [ -z "$ENV_FILE_B64" ]; then
            echo "Missing ENV_FILE_DEMO secret"
            exit 1
          fi

          env_file="$RUNNER_TEMP/env-demo"
          printf '%s' "$ENV_FILE_B64" | base64 --decode > "$env_file"

          required_keys=(
            BACKEND_SECRET_KEY
            BACKEND_POSTGRES_DB
            BACKEND_POSTGRES_USER
            BACKEND_POSTGRES_PASSWORD
            BACKEND_POSTGRES_HOST
            PUBLIC_REGION_DEFAULT_ID
          )

          missing=()
          for key in "${required_keys[@]}"; do
            val="$(grep -E "^${key}=" "$env_file" | head -n1 | cut -d'=' -f2- | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')"
            if [ -z "$val" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required keys in ENV_FILE_DEMO:"
            for k in "${missing[@]}"; do echo "- $k"; done
            exit 1
          fi

          echo "env_file=$env_file" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Copy compose and env files to server
        id: copy_files
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          COMPOSE_PATH: ${{ secrets.DEPLOY_COMPOSE_PATH_WEBAPP }}
          IMAGE_TAG: ${{ needs.validate.outputs.prefixed_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_KEY }}
          envs: COMPOSE_PATH,IMAGE_TAG
          script_stop: true
          script: |
            set -euo pipefail

            if [ -z "$COMPOSE_PATH" ] || [ ! -d "$COMPOSE_PATH" ]; then
              echo "Invalid DEPLOY_COMPOSE_PATH_WEBAPP for Demo"
              exit 1
            fi

            if [ -z "$IMAGE_TAG" ]; then
              echo "Image tag is empty"
              exit 1
            fi

            cd "$COMPOSE_PATH"

            docker pull "ghcr.io/proyectorespira/respira-backend:${IMAGE_TAG}"
            docker pull "ghcr.io/proyectorespira/respira-frontend:${IMAGE_TAG}"
            docker pull "ghcr.io/proyectorespira/respira-proxy:${IMAGE_TAG}"

            BACKEND_IMAGE_TAG="$IMAGE_TAG" \
            FRONTEND_IMAGE_TAG="$IMAGE_TAG" \
            PROXY_IMAGE_TAG="$IMAGE_TAG" \
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.remote.yml \
              --env-file .env.demo \
              up -d --pull always --remove-orphans

            docker compose ps

      - name: Summary
        shell: bash
        run: |
          echo "Demo deployment for ${{ github.ref_name }} completed."
