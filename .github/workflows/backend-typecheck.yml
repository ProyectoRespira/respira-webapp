name: Backend Typecheck

on:
  pull_request:
    branches: [main, develop, dev]
    types: [opened, reopened, synchronize]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-typecheck.yml'

permissions:
  contents: read

concurrency:
  group: backend-typecheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Backend Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install mypy==1.18.2 django-stubs==4.2.7 django-stubs-ext==4.2.7 types-PyYAML==6.0.12.20260508 types-requests==2.33.0.20260508

      - name: Run mypy
        run: PYTHONPATH=backend mypy --config-file backend/mypy.ini backend/api backend/backend backend/manage.py
